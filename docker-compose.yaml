services:
  postgre:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=pg
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app
    ports:
      - 5432:5432
  tomcat:
    image: tomcat:8.5.100-jdk17
    ports:
      - 8080:8080
      - 5005:5005
    volumes:
      - ./Corte01/Dentists/target/dentalia-1.0-SNAPSHOT.war:/usr/local/tomcat/webapps/ROOT.war
      # - ./conf/context.xml:/usr/local/tomcat/conf/context.xml

services:
  postgre:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=pg
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app
  tomcat:
    image: tomcat
    ports:
      - 8080:8080
      - 5005:5005
    volumes:
      - ./Corte1/demo/target/demo-1.0-SNAPSHOT.war:/usr/local/tomcat/webapps/ROOT.war
      # - ./cnf:/usr/local/tomcat/cofy10k
